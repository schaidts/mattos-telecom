<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06120d">
<title>Brasil Football Career 3.0</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{--bg:#06120d;--bg2:#0b1f17;--pn:#0f2519;--pn2:#173a27;--pn3:#1f4b33;--ln:#2f6a47;--ln2:#4f9a6c;--sh:#020805;
--yl:#ffd400;--yl2:#fff1a0;--bl:#3b7bff;--gr:#3ddc84;--rd:#ff5a5f;--or:#ff9f1c;--tx:#eef7e8;--mt:#8fb3a0;
--px:'Press Start 2P',monospace;--vt:VT323,monospace;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font:22px/1.2 var(--vt);
 background:var(--bg) radial-gradient(ellipse at 85% -10%,#12407066,transparent 50%),radial-gradient(ellipse at 0 0,#ffd40012,transparent 40%);
 padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 3px,#00000014 3px 4px);z-index:20}
h1,h2,h3,.px{font-family:var(--px);line-height:1.5;margin:0;font-weight:400}
h1{font-size:14px;color:var(--yl);text-shadow:2px 2px 0 #000}
h2{font-size:10px;color:var(--gr);margin-bottom:10px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
h2 svg{flex:none}
small,.mt{color:var(--mt)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}p{margin:5px 0}
.app{max-width:1020px;margin:auto;padding:12px 12px 24px}
svg.ic{width:16px;height:16px;image-rendering:pixelated;shape-rendering:crispEdges;vertical-align:-2px}
/* ===== Header / nav ===== */
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0 12px}
.logo{display:flex;align-items:center;gap:10px}.logo b{font:9px var(--px);background:var(--yl);color:#102000;padding:3px 5px;box-shadow:2px 2px 0 #000}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{background:var(--pn);border:2px solid var(--ln);padding:3px 9px;color:var(--yl);display:flex;gap:5px;align-items:center}

nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;font-size:19px}
nav button svg.ic{width:20px;height:20px}
/* ===== Controls ===== */
button{font:inherit;color:var(--tx);background:var(--pn2);border:2px solid var(--ln);padding:9px 12px;cursor:pointer;box-shadow:inset 0 2px 0 #ffffff14,0 4px 0 var(--sh);touch-action:manipulation;transition:background .12s,filter .12s}
button:hover:not(:disabled){filter:brightness(1.15)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yl);outline-offset:2px}
button.on,button.go{background:var(--yl);border-color:var(--yl2);color:#1b2a00}
button:disabled{opacity:.4;cursor:not-allowed}
.card{background:linear-gradient(180deg,var(--pn) ,#0c1f15);border:2px solid var(--ln);box-shadow:0 0 0 2px var(--sh),5px 5px 0 2px var(--sh);padding:14px;margin-bottom:14px;position:relative}
.card::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:#ffffff12}
label{display:block;color:var(--mt);margin:9px 0 3px}
input,select{font:inherit;width:100%;background:#04100a;color:var(--tx);border:2px solid var(--ln);padding:7px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:4px 6px;border-bottom:1px solid #1e4a32;font-weight:400}
tr.me td{color:var(--yl)}
.hidden{display:none!important}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.g4>div{background:#04100a88;border:1px solid #1e4a32;padding:6px 2px}
.g4 b{display:block;font:14px var(--px);color:var(--tx);margin-top:4px}
.bar{height:12px;background:#04100a;border:2px solid #1e4a32;margin:3px 0 8px;position:relative}.bar span{display:block;height:100%;transition:width .5s;box-shadow:inset 0 -3px 0 #0003,inset 0 2px 0 #fff3}
.f{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:4px;font:10px var(--px);color:#04100a;box-shadow:2px 2px 0 #000}
.f.V{background:var(--gr)}.f.E{background:var(--yl)}.f.D{background:var(--rd)}
.kb{display:inline-block;width:26px;height:26px;image-rendering:pixelated;vertical-align:middle}
/* ===== Home ===== */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(110deg,#0d4a2a,#0e2a45 70%,#0b1f3a);overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(#ffd40022,#0000 70%)}
.hero>div:nth-child(2){flex:1;min-width:150px}
#av{width:112px;height:112px;image-rendering:pixelated;border:3px solid var(--yl);box-shadow:0 0 0 3px #000,4px 4px 0 3px #000;animation:bob 1.2s steps(2) infinite}
.ovr{text-align:center;background:linear-gradient(160deg,#ffe36a,#c99a00);color:#2a2000;padding:10px 12px 8px;box-shadow:0 0 0 3px #000,4px 4px 0 3px #000;clip-path:polygon(0 0,100% 0,100% 85%,50% 100%,0 85%)}
.ovr b{display:block;font:24px var(--px)}.ovr small{display:block;font:8px var(--px);color:#4a3a00;margin-top:4px}
.tag{display:inline-block;font:8px var(--px);padding:3px 6px;background:#04100a;border:1px solid var(--ln);color:var(--mt);margin:2px 4px 2px 0}
.feed p{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px dashed #1e4a32}
.feed p:last-child{border:0}
/* ===== Train ===== */
.tr{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tr button{text-align:left;display:flex;gap:10px;align-items:center}
.tr button svg.ic{width:28px;height:28px;flex:none}
#tc{display:block;width:100%;image-rendering:pixelated;border:2px solid var(--ln);background:#2c7a46;margin:8px 0}
/* ===== Match ===== */
.fix{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin:10px 0}
.fix img{width:56px;height:56px;image-rendering:pixelated;display:block;margin:0 auto 4px}
.fix .vs{font:12px var(--px);color:var(--yl)}
.hud{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:6px;margin-bottom:8px;background:linear-gradient(#0a1a33,#081226);border:2px solid #24467a;box-shadow:0 0 0 2px #000;padding:4px 6px}
.hud .tm{display:flex;align-items:center;gap:6px;font:9px var(--px);overflow:hidden;white-space:nowrap}.hud .tm.r{justify-content:flex-end}
.hud .tm span{overflow:hidden;text-overflow:ellipsis}
.hud #sc{font:16px var(--px);color:#fff;background:#000;padding:4px 8px;border:1px solid #24467a}
.hud #clk{font:10px var(--px);color:var(--yl);background:#000;padding:5px 6px;min-width:44px;text-align:center}
#vs{display:block;text-align:center;margin:-4px 0 6px}
canvas#pitch{display:block;width:100%;max-width:760px;margin:auto;aspect-ratio:720/500;background:#0b2218;border:3px solid #e9f5df;box-shadow:0 0 0 3px #000;touch-action:manipulation;image-rendering:pixelated}
#ev{min-height:34px;color:var(--yl);text-align:center;margin:8px 0 4px;font:13px/1.6 var(--px);text-shadow:2px 2px 0 #000}
#ev.pop{animation:pop .55s}
#mv{max-width:760px;margin:auto}
#mv .q{font:10px/1.6 var(--px);color:var(--yl);margin:6px 0 10px;text-align:center}
.opt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt button{text-align:left;padding:8px;display:flex;flex-direction:column;gap:3px;animation:in .3s backwards}
.opt button:nth-child(2){animation-delay:.06s}.opt button:nth-child(3){animation-delay:.12s}
.opt b{font:9px/1.5 var(--px);color:var(--yl)}
.rk{display:flex;gap:2px}.rk i{width:8px;height:8px;background:#04100a;border:1px solid var(--ln)}.rk i.on{background:var(--or)}
#tb{position:relative;height:34px;background:repeating-linear-gradient(90deg,#04100a 0 10px,#071a10 10px 20px);border:3px solid var(--ln);margin:10px 0;box-shadow:0 0 0 2px #000}
#zn{position:absolute;top:0;bottom:0;background:#3ddc8466;border-inline:2px solid var(--gr)}
#zp{position:absolute;top:0;bottom:0;left:25%;width:50%;background:#ffd40088;box-shadow:0 0 10px #ffd400}
#cur{position:absolute;top:-6px;bottom:-6px;width:6px;margin-left:-3px;background:#fff;box-shadow:0 0 0 2px #000,0 0 10px #fff}
#res .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px;margin:10px 0}
#res .score b{font:26px var(--px);color:#fff;text-shadow:3px 3px 0 #000}
#res .score img{width:48px;height:48px;image-rendering:pixelated;display:block;margin:0 auto 4px}
.rating{display:inline-block;font:16px var(--px);padding:8px 10px;color:#04100a;box-shadow:3px 3px 0 #000}
.lg p{display:flex;gap:10px;border-bottom:1px dashed #1e4a32;padding:3px 0}.lg p i{font-style:normal;color:var(--yl);min-width:36px}
/* ===== Career / market ===== */
.atr{display:grid;grid-template-columns:22px 1fr 34px;gap:4px 8px;align-items:center}
.atr .bar{grid-column:1/-1;margin:0 0 6px}
#radar{width:100%;max-width:240px;display:block;margin:0 auto 8px}
.step{padding:8px 10px;border-left:4px solid var(--ln);margin:6px 0;color:var(--mt)}.step.cur{border-color:var(--yl);color:var(--tx);background:#183a28}.step.ok{border-color:var(--gr)}
.board{position:relative;aspect-ratio:3/2;background:repeating-linear-gradient(90deg,#2c7a46 0 12.5%,#318850 12.5% 25%);border:3px solid #e9f5df;margin-bottom:10px;overflow:hidden}
.board::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #e9f5dfaa}
.board::after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid #e9f5dfaa;border-radius:50%;transform:translate(-50%,-50%)}
.slot{position:absolute;transform:translate(-50%,-50%);text-align:center;z-index:1;font-size:16px;line-height:1;width:72px}
.slot img{width:40px;height:40px;image-rendering:pixelated;display:block;margin:0 auto 2px;border:2px solid #000;background:#0b1f17}
.slot.me img{border-color:var(--yl);box-shadow:0 0 0 2px #000,0 0 12px var(--yl)}
.slot span{background:#000c;padding:1px 4px}
.pt{width:28px;height:28px;image-rendering:pixelated;vertical-align:middle;border:1px solid #000}
.off{padding:8px 0;border-bottom:1px solid #1e4a32}
/* ===== Modals / menu ===== */
.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:14px;z-index:10;overflow:auto;animation:fade .25s}
.modal .card{max-width:480px;width:100%;margin:0;animation:pop2 .3s}
.mn{max-width:400px;width:100%;text-align:center;background:linear-gradient(#10261c,#0a1a12);border:3px solid var(--yl);padding:14px;box-shadow:0 0 0 4px #000,0 0 60px #ffd40033;animation:pop2 .35s}
.mn canvas{width:100%;image-rendering:pixelated;border:2px solid var(--ln);margin-bottom:10px;display:block}
.mn h1{font-size:15px;line-height:1.7}.mn h1 span{display:block;font-size:28px;color:#fff;text-shadow:3px 3px 0 #c99a00,6px 6px 0 #000;margin-top:4px}
.mn button{display:block;width:100%;margin:8px 0}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw button{width:30px;height:30px;padding:0;box-shadow:0 3px 0 #000}.sw button.on{outline:3px solid var(--yl);outline-offset:1px}
.cre{display:grid;grid-template-columns:1fr 120px;gap:12px}.cre canvas{width:120px;height:120px;image-rendering:pixelated;border:3px solid var(--yl);background:#0b1f17}
@media(max-width:700px){.g2{grid-template-columns:1fr}.hero{flex-wrap:wrap}.app{padding:8px 8px 20px}.opt{grid-template-columns:1fr}.hud .tm span{display:none}}
@media(max-width:420px){.cre{grid-template-columns:1fr}.cre canvas{margin:auto}nav button{font-size:16px}.tr{grid-template-columns:1fr}}
.sit{text-align:center;background:#04100a;border:2px solid var(--ln);padding:6px;margin:6px 0}.sit b{display:block;font:10px/1.6 var(--px);color:var(--gr)}.sit span{color:var(--mt)}.sit i{display:block;font:9px/1.8 var(--px);font-style:normal;color:var(--rd);animation:bob .6s steps(2) infinite}
.tag.gr{color:var(--gr);border-color:var(--gr)}.tag.rd{color:var(--rd);border-color:var(--rd)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--yl);color:#1b2a00;font:10px/1.5 var(--px);padding:10px 14px;box-shadow:0 0 0 3px #000,4px 4px 0 3px #000;z-index:30;animation:pop2 .3s}
/* ===== Motion ===== */
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.25)}100%{transform:none;opacity:1}}
@keyframes pop2{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-3px)}}
section.enter{animation:in .28s}
.card{animation:in .3s backwards}.g2 .card:nth-child(2){animation-delay:.05s}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 3.2: identidade visual inspirada em jogos de futebol pixel art ===== */
body{background:var(--bg) linear-gradient(180deg,#0a2a18 0,#06120d 320px)}
.app{max-width:1100px}
header{position:sticky;top:0;z-index:6;background:linear-gradient(#06120df2,#06120dd9);padding:6px 0 6px;margin:0 -12px;padding-inline:12px;border-bottom:2px solid #0f3a22}
.crest{width:34px;height:38px;image-rendering:pixelated;flex:none}
.logo h1{font-size:11px;line-height:1.35}.logo h1 span{display:block;color:#fff;font-size:9px}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 12px}
nav button{background:linear-gradient(#1a4a30,#10301f);border:2px solid #2f6a47;box-shadow:inset 0 2px 0 #ffffff1a,0 4px 0 #020805}
nav button.on{background:linear-gradient(#ffe14d,#e6b800);border-color:#fff1a0;color:#1b2a00}
.pill{background:#0b1f17;border:2px solid #2f6a47;font-size:20px;box-shadow:inset 0 2px 0 #ffffff12}
.pill svg.ic{width:18px;height:18px}
.ph{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#0f3a22,#0b2418);border:2px solid #2f6a47;box-shadow:0 0 0 2px #000;padding:10px 12px;margin-bottom:12px}
.ph svg.ic{width:30px;height:30px;color:var(--yl)}.ph h1{font-size:13px}.ph small{display:block}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}.seg button{padding:6px 10px;font-size:18px}.seg button.on{background:var(--gr);color:#04220f;border-color:#bff5d4}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:14px}
.mbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;margin:0 0 8px;background:linear-gradient(#173f2a,#0f2a1c);position:relative}
.mbtn svg.ic{width:30px;height:30px;flex:none;color:var(--yl)}.mbtn b{display:block;font:11px/1.5 var(--px);color:#fff}.mbtn small{display:block}
.mbtn::after{content:"›";position:absolute;right:12px;top:50%;transform:translateY(-50%);font:22px var(--px);color:var(--gr)}
.mbtn.go{background:linear-gradient(#ffe14d,#e6b800)}.mbtn.go b,.mbtn.go small{color:#1b2a00}.mbtn.go svg.ic{color:#1b2a00}.mbtn.go::after{color:#1b2a00}
.pcard{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center}.pcard canvas{width:104px;height:104px;box-sizing:border-box;image-rendering:pixelated;border:3px solid var(--yl);background:#0b1f17}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid #1e4a32;padding:2px 0}.kv b{color:var(--yl);font-weight:400}
.sbar{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;margin:3px 0}.sbar .bar{margin:0}
.comps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.comps button{display:flex;flex-direction:column;align-items:center;gap:4px;font:8px/1.4 var(--px);padding:10px 4px}.comps svg.ic{width:24px;height:24px;color:var(--yl)}
.fxbig{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}.fxbig img{width:64px;height:64px;image-rendering:pixelated;display:block;margin:0 auto 4px}.fxbig .vs{font:14px var(--px);color:var(--yl)}
.st{display:inline-block;font:8px var(--px);padding:4px 6px;border:2px solid;margin:2px}.st.t{color:var(--gr)}.st.r{color:var(--or)}.st.l{color:var(--rd)}
.cal p{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed #1e4a32;padding:5px 0;margin:0}.cal p.cur{background:#ffd40018;border-left:3px solid var(--yl);padding-left:4px}.cal p.done{color:var(--mt)}
.cal .cm{font:7px var(--px);padding:3px 4px;background:#04100a;border:1px solid var(--ln);text-align:center}
.news p{display:grid;grid-template-columns:24px 1fr;gap:8px;border-bottom:1px dashed #1e4a32;padding:6px 0;margin:0}.news p small{display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.tcard{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px;align-items:start}
.tbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:8px}.tbtn svg.ic{width:28px;height:28px;color:var(--yl);flex:none}.tbtn.sel{background:linear-gradient(#ffe14d,#e6b800);color:#1b2a00}.tbtn.sel b,.tbtn.sel small{color:#1b2a00}.tbtn.sel svg.ic{color:#1b2a00}
.big{font:12px var(--px);padding:14px}
.chk p{margin:3px 0}.chk p::before{content:"✔ ";color:var(--gr)}
/* partida */
#match .mgrid{display:grid;grid-template-columns:1fr 250px;gap:10px;align-items:start}
.log{max-height:430px;overflow:auto}.log p{display:grid;grid-template-columns:34px 1fr;gap:6px;border-bottom:1px dashed #1e4a32;padding:4px 0;margin:0;font-size:19px}.log i{font-style:normal;color:var(--yl)}
.hud .cmp{font:8px var(--px);color:var(--yl);display:none}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.acts button{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 6px;animation:in .3s backwards}
.acts button svg.ic{width:30px;height:30px;color:var(--yl)}.acts b{font:9px/1.5 var(--px);color:#fff}
.posi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.posi button.rec{border-color:var(--yl)}
.slot.inj img{filter:grayscale(1)}
.nego{display:flex;gap:10px;align-items:center}.nego img{width:56px;height:56px;image-rendering:pixelated}
.coach{display:flex;gap:10px;align-items:flex-start;background:#04100a;border:2px solid var(--ln);padding:8px;margin:10px 0}.coach svg.ic{width:26px;height:26px;color:var(--yl);flex:none}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.wiz{display:flex;gap:4px;margin-bottom:10px}.wiz i{flex:1;height:6px;background:#04100a;border:1px solid var(--ln)}.wiz i.on{background:var(--yl)}
.cards3{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.cards3 button{text-align:left;font-size:18px;padding:8px}.cards3 button.on{background:var(--yl);color:#1b2a00}.cards3 button b{display:block;font:9px/1.5 var(--px)}
.clubs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.clubs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px}.clubs button.on{background:var(--yl);color:#1b2a00}.clubs img{width:40px;height:40px;image-rendering:pixelated}
#menu{padding:0;place-items:stretch;background:#000}
.mmenu{position:relative;min-height:100%;padding:14px;background:linear-gradient(#0000,#06120d 85%);display:grid;grid-template-columns:minmax(260px,420px) 1fr minmax(240px,320px);gap:16px;align-content:start;max-width:1200px;margin:auto;width:100%}
.mmenu .mlogo{grid-column:1/-1;display:flex;align-items:center;gap:14px}.mmenu .mlogo canvas{width:64px;height:72px;image-rendering:pixelated}
