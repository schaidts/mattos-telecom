<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06120d">
<title>Brasil Football Career 3.0</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{--bg:#06120d;--bg2:#0b1f17;--pn:#0f2519;--pn2:#173a27;--pn3:#1f4b33;--ln:#2f6a47;--ln2:#4f9a6c;--sh:#020805;
--yl:#ffd400;--yl2:#fff1a0;--bl:#3b7bff;--gr:#3ddc84;--rd:#ff5a5f;--or:#ff9f1c;--tx:#eef7e8;--mt:#8fb3a0;
--px:'Press Start 2P',monospace;--vt:VT323,monospace;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font:22px/1.2 var(--vt);
 background:var(--bg) radial-gradient(ellipse at 85% -10%,#12407066,transparent 50%),radial-gradient(ellipse at 0 0,#ffd40012,transparent 40%);
 padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 3px,#00000014 3px 4px);z-index:20}
h1,h2,h3,.px{font-family:var(--px);line-height:1.5;margin:0;font-weight:400}
h1{font-size:14px;color:var(--yl);text-shadow:2px 2px 0 #000}
h2{font-size:10px;color:var(--gr);margin-bottom:10px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
h2 svg{flex:none}
small,.mt{color:var(--mt)}.yl{color:var(--yl)}.gr{color:var(--gr)}.rd{color:var(--rd)}p{margin:5px 0}
.app{max-width:1020px;margin:auto;padding:12px 12px 24px}
svg.ic{width:16px;height:16px;image-rendering:pixelated;shape-rendering:crispEdges;vertical-align:-2px}
/* ===== Header / nav ===== */
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0 12px}
.logo{display:flex;align-items:center;gap:10px}.logo b{font:9px var(--px);background:var(--yl);color:#102000;padding:3px 5px;box-shadow:2px 2px 0 #000}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{background:var(--pn);border:2px solid var(--ln);padding:3px 9px;color:var(--yl);display:flex;gap:5px;align-items:center}

nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;font-size:19px}
nav button svg.ic{width:20px;height:20px}
/* ===== Controls ===== */
button{font:inherit;color:var(--tx);background:var(--pn2);border:2px solid var(--ln);padding:9px 12px;cursor:pointer;box-shadow:inset 0 2px 0 #ffffff14,0 4px 0 var(--sh);touch-action:manipulation;transition:background .12s,filter .12s}
button:hover:not(:disabled){filter:brightness(1.15)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yl);outline-offset:2px}
button.on,button.go{background:var(--yl);border-color:var(--yl2);color:#1b2a00}
button:disabled{opacity:.4;cursor:not-allowed}
.card{background:linear-gradient(180deg,var(--pn) ,#0c1f15);border:2px solid var(--ln);box-shadow:0 0 0 2px var(--sh),5px 5px 0 2px var(--sh);padding:14px;margin-bottom:14px;position:relative}
.card::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:#ffffff12}
label{display:block;color:var(--mt);margin:9px 0 3px}
input,select{font:inherit;width:100%;background:#04100a;color:var(--tx);border:2px solid var(--ln);padding:7px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:4px 6px;border-bottom:1px solid #1e4a32;font-weight:400}
tr.me td{color:var(--yl)}
.hidden{display:none!important}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.g4>div{background:#04100a88;border:1px solid #1e4a32;padding:6px 2px}
.g4 b{display:block;font:14px var(--px);color:var(--tx);margin-top:4px}
.bar{height:12px;background:#04100a;border:2px solid #1e4a32;margin:3px 0 8px;position:relative}.bar span{display:block;height:100%;transition:width .5s;box-shadow:inset 0 -3px 0 #0003,inset 0 2px 0 #fff3}
.f{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:4px;font:10px var(--px);color:#04100a;box-shadow:2px 2px 0 #000}
.f.V{background:var(--gr)}.f.E{background:var(--yl)}.f.D{background:var(--rd)}
.kb{display:inline-block;width:26px;height:26px;image-rendering:pixelated;vertical-align:middle}
/* ===== Home ===== */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(110deg,#0d4a2a,#0e2a45 70%,#0b1f3a);overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(#ffd40022,#0000 70%)}
.hero>div:nth-child(2){flex:1;min-width:150px}
#av{width:112px;height:112px;image-rendering:pixelated;border:3px solid var(--yl);box-shadow:0 0 0 3px #000,4px 4px 0 3px #000;animation:bob 1.2s steps(2) infinite}
.ovr{text-align:center;background:linear-gradient(160deg,#ffe36a,#c99a00);color:#2a2000;padding:10px 12px 8px;box-shadow:0 0 0 3px #000,4px 4px 0 3px #000;clip-path:polygon(0 0,100% 0,100% 85%,50% 100%,0 85%)}
.ovr b{display:block;font:24px var(--px)}.ovr small{display:block;font:8px var(--px);color:#4a3a00;margin-top:4px}
.tag{display:inline-block;font:8px var(--px);padding:3px 6px;background:#04100a;border:1px solid var(--ln);color:var(--mt);margin:2px 4px 2px 0}
.feed p{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px dashed #1e4a32}
.feed p:last-child{border:0}
/* ===== Train ===== */
.tr{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tr button{text-align:left;display:flex;gap:10px;align-items:center}
.tr button svg.ic{width:28px;height:28px;flex:none}
#tc{display:block;width:100%;image-rendering:pixelated;border:2px solid var(--ln);background:#2c7a46;margin:8px 0}
/* ===== Match ===== */
.fix{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin:10px 0}
.fix img{width:56px;height:56px;image-rendering:pixelated;display:block;margin:0 auto 4px}
.fix .vs{font:12px var(--px);color:var(--yl)}
.hud{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:6px;margin-bottom:8px;background:linear-gradient(#0a1a33,#081226);border:2px solid #24467a;box-shadow:0 0 0 2px #000;padding:4px 6px}
.hud .tm{display:flex;align-items:center;gap:6px;font:9px var(--px);overflow:hidden;white-space:nowrap}.hud .tm.r{justify-content:flex-end}
.hud .tm span{overflow:hidden;text-overflow:ellipsis}
.hud #sc{font:16px var(--px);color:#fff;background:#000;padding:4px 8px;border:1px solid #24467a}
.hud #clk{font:10px var(--px);color:var(--yl);background:#000;padding:5px 6px;min-width:44px;text-align:center}
#vs{display:block;text-align:center;margin:-4px 0 6px}
canvas#pitch{display:block;width:100%;max-width:760px;margin:auto;aspect-ratio:720/500;background:#0b2218;border:3px solid #e9f5df;box-shadow:0 0 0 3px #000;touch-action:manipulation;image-rendering:pixelated}
#ev{min-height:34px;color:var(--yl);text-align:center;margin:8px 0 4px;font:13px/1.6 var(--px);text-shadow:2px 2px 0 #000}
#ev.pop{animation:pop .55s}
#mv{max-width:760px;margin:auto}
#mv .q{font:10px/1.6 var(--px);color:var(--yl);margin:6px 0 10px;text-align:center}
.opt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt button{text-align:left;padding:8px;display:flex;flex-direction:column;gap:3px;animation:in .3s backwards}
.opt button:nth-child(2){animation-delay:.06s}.opt button:nth-child(3){animation-delay:.12s}
.opt b{font:9px/1.5 var(--px);color:var(--yl)}
.rk{display:flex;gap:2px}.rk i{width:8px;height:8px;background:#04100a;border:1px solid var(--ln)}.rk i.on{background:var(--or)}
#tb{position:relative;height:34px;background:repeating-linear-gradient(90deg,#04100a 0 10px,#071a10 10px 20px);border:3px solid var(--ln);margin:10px 0;box-shadow:0 0 0 2px #000}
#zn{position:absolute;top:0;bottom:0;background:#3ddc8466;border-inline:2px solid var(--gr)}
#zp{position:absolute;top:0;bottom:0;left:25%;width:50%;background:#ffd40088;box-shadow:0 0 10px #ffd400}
#cur{position:absolute;top:-6px;bottom:-6px;width:6px;margin-left:-3px;background:#fff;box-shadow:0 0 0 2px #000,0 0 10px #fff}
#res .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px;margin:10px 0}
#res .score b{font:26px var(--px);color:#fff;text-shadow:3px 3px 0 #000}
#res .score img{width:48px;height:48px;image-rendering:pixelated;display:block;margin:0 auto 4px}
.rating{display:inline-block;font:16px var(--px);padding:8px 10px;color:#04100a;box-shadow:3px 3px 0 #000}
.lg p{display:flex;gap:10px;border-bottom:1px dashed #1e4a32;padding:3px 0}.lg p i{font-style:normal;color:var(--yl);min-width:36px}
/* ===== Career / market ===== */
.atr{display:grid;grid-template-columns:22px 1fr 34px;gap:4px 8px;align-items:center}
.atr .bar{grid-column:1/-1;margin:0 0 6px}
#radar{width:100%;max-width:240px;display:block;margin:0 auto 8px}
.step{padding:8px 10px;border-left:4px solid var(--ln);margin:6px 0;color:var(--mt)}.step.cur{border-color:var(--yl);color:var(--tx);background:#183a28}.step.ok{border-color:var(--gr)}
.board{position:relative;aspect-ratio:3/2;background:repeating-linear-gradient(90deg,#2c7a46 0 12.5%,#318850 12.5% 25%);border:3px solid #e9f5df;margin-bottom:10px;overflow:hidden}
.board::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #e9f5dfaa}
.board::after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid #e9f5dfaa;border-radius:50%;transform:translate(-50%,-50%)}
.slot{position:absolute;transform:translate(-50%,-50%);text-align:center;z-index:1;font-size:16px;line-height:1;width:72px}
.slot img{width:40px;height:40px;image-rendering:pixelated;display:block;margin:0 auto 2px;border:2px solid #000;background:#0b1f17}
.slot.me img{border-color:var(--yl);box-shadow:0 0 0 2px #000,0 0 12px var(--yl)}
.slot span{background:#000c;padding:1px 4px}
.pt{width:28px;height:28px;image-rendering:pixelated;vertical-align:middle;border:1px solid #000}
.off{padding:8px 0;border-bottom:1px solid #1e4a32}
/* ===== Modals / menu ===== */
.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:14px;z-index:10;overflow:auto;animation:fade .25s}
.modal .card{max-width:480px;width:100%;margin:0;animation:pop2 .3s}
.mn{max-width:400px;width:100%;text-align:center;background:linear-gradient(#10261c,#0a1a12);border:3px solid var(--yl);padding:14px;box-shadow:0 0 0 4px #000,0 0 60px #ffd40033;animation:pop2 .35s}
.mn canvas{width:100%;image-rendering:pixelated;border:2px solid var(--ln);margin-bottom:10px;display:block}
.mn h1{font-size:15px;line-height:1.7}.mn h1 span{display:block;font-size:28px;color:#fff;text-shadow:3px 3px 0 #c99a00,6px 6px 0 #000;margin-top:4px}
.mn button{display:block;width:100%;margin:8px 0}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw button{width:30px;height:30px;padding:0;box-shadow:0 3px 0 #000}.sw button.on{outline:3px solid var(--yl);outline-offset:1px}
.cre{display:grid;grid-template-columns:1fr 120px;gap:12px}.cre canvas{width:120px;height:120px;image-rendering:pixelated;border:3px solid var(--yl);background:#0b1f17}
@media(max-width:700px){.g2{grid-template-columns:1fr}.hero{flex-wrap:wrap}.app{padding:8px 8px 20px}.opt{grid-template-columns:1fr}.hud .tm span{display:none}}
@media(max-width:420px){.cre{grid-template-columns:1fr}.cre canvas{margin:auto}nav button{font-size:16px}.tr{grid-template-columns:1fr}}
.sit{text-align:center;background:#04100a;border:2px solid var(--ln);padding:6px;margin:6px 0}.sit b{display:block;font:10px/1.6 var(--px);color:var(--gr)}.sit span{color:var(--mt)}.sit i{display:block;font:9px/1.8 var(--px);font-style:normal;color:var(--rd);animation:bob .6s steps(2) infinite}
.tag.gr{color:var(--gr);border-color:var(--gr)}.tag.rd{color:var(--rd);border-color:var(--rd)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--yl);color:#1b2a00;font:10px/1.5 var(--px);padding:10px 14px;box-shadow:0 0 0 3px #000,4px 4px 0 3px #000;z-index:30;animation:pop2 .3s}
/* ===== Motion ===== */
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.25)}100%{transform:none;opacity:1}}
@keyframes pop2{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-3px)}}
section.enter{animation:in .28s}
.card{animation:in .3s backwards}.g2 .card:nth-child(2){animation-delay:.05s}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 3.2: identidade visual inspirada em jogos de futebol pixel art ===== */
body{background:var(--bg) linear-gradient(180deg,#0a2a18 0,#06120d 320px)}
.app{max-width:1100px}
header{position:sticky;top:0;z-index:6;background:linear-gradient(#06120df2,#06120dd9);padding:6px 0 6px;margin:0 -12px;padding-inline:12px;border-bottom:2px solid #0f3a22}
.crest{width:34px;height:38px;image-rendering:pixelated;flex:none}
.logo h1{font-size:11px;line-height:1.35}.logo h1 span{display:block;color:#fff;font-size:9px}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 12px}
nav button{background:linear-gradient(#1a4a30,#10301f);border:2px solid #2f6a47;box-shadow:inset 0 2px 0 #ffffff1a,0 4px 0 #020805}
nav button.on{background:linear-gradient(#ffe14d,#e6b800);border-color:#fff1a0;color:#1b2a00}
.pill{background:#0b1f17;border:2px solid #2f6a47;font-size:20px;box-shadow:inset 0 2px 0 #ffffff12}
.pill svg.ic{width:18px;height:18px}
.ph{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#0f3a22,#0b2418);border:2px solid #2f6a47;box-shadow:0 0 0 2px #000;padding:10px 12px;margin-bottom:12px}
.ph svg.ic{width:30px;height:30px;color:var(--yl)}.ph h1{font-size:13px}.ph small{display:block}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}.seg button{padding:6px 10px;font-size:18px}.seg button.on{background:var(--gr);color:#04220f;border-color:#bff5d4}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:14px}
.mbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;margin:0 0 8px;background:linear-gradient(#173f2a,#0f2a1c);position:relative}
.mbtn svg.ic{width:30px;height:30px;flex:none;color:var(--yl)}.mbtn b{display:block;font:11px/1.5 var(--px);color:#fff}.mbtn small{display:block}
.mbtn::after{content:"›";position:absolute;right:12px;top:50%;transform:translateY(-50%);font:22px var(--px);color:var(--gr)}
.mbtn.go{background:linear-gradient(#ffe14d,#e6b800)}.mbtn.go b,.mbtn.go small{color:#1b2a00}.mbtn.go svg.ic{color:#1b2a00}.mbtn.go::after{color:#1b2a00}
.pcard{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center}.pcard canvas{width:104px;height:104px;box-sizing:border-box;image-rendering:pixelated;border:3px solid var(--yl);background:#0b1f17}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid #1e4a32;padding:2px 0}.kv b{color:var(--yl);font-weight:400}
.sbar{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;margin:3px 0}.sbar .bar{margin:0}
.comps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.comps button{display:flex;flex-direction:column;align-items:center;gap:4px;font:8px/1.4 var(--px);padding:10px 4px}.comps svg.ic{width:24px;height:24px;color:var(--yl)}
.fxbig{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}.fxbig img{width:64px;height:64px;image-rendering:pixelated;display:block;margin:0 auto 4px}.fxbig .vs{font:14px var(--px);color:var(--yl)}
.st{display:inline-block;font:8px var(--px);padding:4px 6px;border:2px solid;margin:2px}.st.t{color:var(--gr)}.st.r{color:var(--or)}.st.l{color:var(--rd)}
.cal p{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed #1e4a32;padding:5px 0;margin:0}.cal p.cur{background:#ffd40018;border-left:3px solid var(--yl);padding-left:4px}.cal p.done{color:var(--mt)}
.cal .cm{font:7px var(--px);padding:3px 4px;background:#04100a;border:1px solid var(--ln);text-align:center}
.news p{display:grid;grid-template-columns:24px 1fr;gap:8px;border-bottom:1px dashed #1e4a32;padding:6px 0;margin:0}.news p small{display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.tcard{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px;align-items:start}
.tbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:8px}.tbtn svg.ic{width:28px;height:28px;color:var(--yl);flex:none}.tbtn.sel{background:linear-gradient(#ffe14d,#e6b800);color:#1b2a00}.tbtn.sel b,.tbtn.sel small{color:#1b2a00}.tbtn.sel svg.ic{color:#1b2a00}
.big{font:12px var(--px);padding:14px}
.chk p{margin:3px 0}.chk p::before{content:"✔ ";color:var(--gr)}
/* partida */
#match .mgrid{display:grid;grid-template-columns:1fr 250px;gap:10px;align-items:start}
.log{max-height:430px;overflow:auto}.log p{display:grid;grid-template-columns:34px 1fr;gap:6px;border-bottom:1px dashed #1e4a32;padding:4px 0;margin:0;font-size:19px}.log i{font-style:normal;color:var(--yl)}
.hud .cmp{font:8px var(--px);color:var(--yl);display:none}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.acts button{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 6px;animation:in .3s backwards}
.acts button svg.ic{width:30px;height:30px;color:var(--yl)}.acts b{font:9px/1.5 var(--px);color:#fff}
.posi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.posi button.rec{border-color:var(--yl)}
.slot.inj img{filter:grayscale(1)}
.nego{display:flex;gap:10px;align-items:center}.nego img{width:56px;height:56px;image-rendering:pixelated}
.coach{display:flex;gap:10px;align-items:flex-start;background:#04100a;border:2px solid var(--ln);padding:8px;margin:10px 0}.coach svg.ic{width:26px;height:26px;color:var(--yl);flex:none}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.wiz{display:flex;gap:4px;margin-bottom:10px}.wiz i{flex:1;height:6px;background:#04100a;border:1px solid var(--ln)}.wiz i.on{background:var(--yl)}
.cards3{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.cards3 button{text-align:left;font-size:18px;padding:8px}.cards3 button.on{background:var(--yl);color:#1b2a00}.cards3 button b{display:block;font:9px/1.5 var(--px)}
.clubs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.clubs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px}.clubs button.on{background:var(--yl);color:#1b2a00}.clubs img{width:40px;height:40px;image-rendering:pixelated}
#menu{padding:0;place-items:stretch;background:#000}
.mmenu{position:relative;min-height:100%;padding:14px;background:linear-gradient(#0000,#06120d 85%);display:grid;grid-template-columns:minmax(260px,420px) 1fr minmax(240px,320px);gap:16px;align-content:start;max-width:1200px;margin:auto;width:100%}
.mmenu .mlogo{grid-column:1/-1;display:flex;align-items:center;gap:14px}.mmenu .mlogo canvas{width:64px;height:72px;image-rendering:pixelated}

function addXP(k,v){S.xp[k]=(S.xp[k]||0)+v*gainMult(k);let up=0;while(S.xp[k]>=100&&S.attrs[k]<99){S.xp[k]-=100;S.attrs[k]++;up++}if(S.attrs[k]>=99)S.xp[k]=0;return up}
const specs=()=>Object.keys(SPEC).filter(k=>S.attrs[k]>=72);
const potTxt=()=>{const lo=S.age<=21?Math.max(40,S.pot-4):S.pot,hi=S.age<=21?Math.min(99,S.pot+4):S.pot;return lo===hi?''+S.pot:lo+'–'+hi};
const potStars=()=>Math.round(S.pot/20*2)/2;
function ageDecline(){const out=[];const dn=(k,n)=>{if(n>0){S.attrs[k]=Math.max(20,S.attrs[k]-n);out.push(AN[k]+' -'+n)}};
 if(S.age>=31){dn('speed',1+((RN()*3)|0));dn('physical',(RN()*3)|0)}if(S.age>=33)['shoot','pass','dribble','defense'].forEach(k=>dn(k,(RN()*2)|0));if(S.age>=35)['speed','physical'].forEach(k=>dn(k,1));return out}
function calcMV(){const o=ovr(),h=played().slice(0,5),av=h.length?avgOf(h):6,ag=S.age<=21?1.3:S.age<=26?1.1:S.age<=29?1:S.age<=32?.7:.4;
 let v=20*Math.pow(1.13,o-40)*[1,2.5,6][S.lvl]*ag*(1+Math.max(0,S.pot-o)/40*(S.age<=23?1:.3))*(.8+av/25)*(S.pers==='Estrela'?1.15:1);return Math.max(5,Math.round(v))}
function updMV(){const v=calcMV();S.mvh.push(v);S.mvh=S.mvh.slice(-12);S.mv=v}

function status(fx){if(S.inj)return 'Lesionado';if(S.susp>0&&fx&&fx.comp!=='sel')return 'Suspenso';if(fx&&fx.comp==='sel')return 'Titular';if(!S.rival)newRival();return S.rival.out>0||starterScore()>=S.rival.o+2?'Titular':'Reserva'}

function coachTalk(n){return n>=8.5?'Atuação de gala. Você é peça-chave.':n>=7.5?'Muito bom. Continue assim e a vaga é sua.':n>=6.5?'Partida correta, mas quero mais.':n>=5.5?'Abaixo do esperado. Precisa render mais.':'Muito ruim. Vou repensar a escalação.'}

/* ---------- lesões ---------- */
const INJ={Leve:['Pancada no tornozelo','Desconforto muscular','Torção leve no pé'],Moderada:['Estiramento na coxa','Entorse no tornozelo','Lesão na panturrilha'],Grave:['Lesão no ligamento do joelho','Fratura no pé','Ruptura muscular']};
function injure(risk,src){if(S.inj||RN()>=risk)return null;const r=RN(),sev=r<.68?'Leve':r<.93?'Moderada':'Grave',w=sev==='Leve'?1+((RN()*2)|0):sev==='Moderada'?3+((RN()*3)|0):8+((RN()*7)|0);
 S.inj={n:pickR(INJ[sev]),sev,w};news(`Lesão ${sev.toLowerCase()}: ${S.inj.n}`,`${src}. Previsão: ${w} semana(s) fora.`,'voce','rest');moraleAdd(-6);return S.inj}

/* ---------- competições ---------- */
function rrSchedule(ids){const t=[...ids];if(t.length%2)t.push(null);const n=t.length,R=[];for(let r=0;r<n-1;r++){const p=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a!=null&&b!=null)p.push(r%2?[b,a]:[a,b])}R.push(p);t.splice(1,0,t.pop())}return R}
const mkKO=ids=>({alive:[...ids],pairs:null,r:0,champ:null,log:[]});
function buildSeason(){const lib=S.lvl===2&&S.qlib;S.qlib=0;
 const sch=rrSchedule([...BR].sort(()=>RN()-.5)),tab={};BR.forEach(i=>tab[i]={p:0,j:0,v:0,e:0,d:0,gp:0,gc:0});
 S.comp={bra:{sch,tab},est:null,cdb:null,lib:lib?'q':null,sc:{est:{},bra:{},cdb:{},lib:{},sel:{}},st:{}};
 const sl=[{k:'est',r:0,w:'pre'},{k:'est',r:1,w:'pre'}];
 for(let r=0;r<sch.length;r++){sl.push({k:'bra',r,w:r>=6&&r<=7?'mid':null});if(r===2)sl.push({k:'cdb',r:0});if(r===6)sl.push({k:'cdb',r:1});if(r===10)sl.push({k:'cdb',r:2});
  if(lib){if(r===1)sl.push({k:'lib',r:0});if(r===5)sl.push({k:'lib',r:1});if(r===9)sl.push({k:'lib',r:2})}}
 S.sl=sl;S.wk=0;S.ap=2;S.G=S.Gl=S.A=S.W=S.D=S.L=S.Sv=0;S.offers=S.offers.filter(o=>o.type==='free');S.ow={};S.ask=0;S.conv=0;
 if(!S.coach||S.coach.cl!==S.club)newCoach();newRival();mkGoals();updMV();genInterest();openWindow('pre')}
function koFor(k){const c=S.comp;if(c[k]&&c[k]!=='q')return c[k];
 if(k==='est'){const reg=REG[S.club]||'NE';let ids=CL.map((_,i)=>i).filter(i=>REG[i]===reg&&(isBR(i)||CL[i].x==='est'));const br=ids.filter(isBR);ids=br.length>=4?br.slice(0,4):[...br,...ids.filter(i=>!isBR(i))].slice(0,4);
  if(!ids.includes(S.club))ids[3]=S.club;c.est={...mkKO(ids.sort(()=>RN()-.5)),n:'Estadual '+reg};c.est.r=0;return c.est}
 if(k==='cdb'){const o=BR.filter(i=>i!==S.club).sort(()=>RN()-.5).slice(0,7);c.cdb=mkKO([S.club,...o].sort(()=>RN()-.5));return c.cdb}
 if(k==='lib'&&c.lib==='q'){const o=CL.map((_,i)=>i).filter(i=>CL[i].x==='lib').slice(0,7);c.lib=mkKO([S.club,...o].sort(()=>RN()-.5));return c.lib}
 return null}
function drawPairs(ko){if(ko.pairs)return;const a=[...ko.alive];ko.pairs=[];for(let i=0;i+1<a.length;i+=2)ko.pairs.push([a[i],a[i+1]])}
// próximo compromisso do jogador (calculado, nunca guardado)
function nextFx(){const s=S.sl[S.wk];if(!s)return null;const base={comp:s.k,r:s.r,slot:S.wk};
 if(s.k==='sel')return{...base,my:BRA,opp:s.opp,home:true,label:'Amistoso da Seleção '+LVN(),final:false,ko:false};
 if(s.k==='bra'){const p=S.comp.bra.sch[s.r].find(x=>x.includes(S.club));if(!p)return{...base,bye:true,label:`Brasileirão · Rodada ${s.r+1}`};return{...base,my:S.club,opp:p[0]===S.club?p[1]:p[0],home:p[0]===S.club,label:`Brasileirão ${LVN()} · Rodada ${s.r+1}`,final:s.r===S.comp.bra.sch.length-1,ko:false}}
 const ko=koFor(s.k);if(!ko||ko.champ!=null||ko.r!==s.r)return{...base,bye:true,label:COMP[s.k]+' · '+(ko&&ko.champ!=null?'encerrado':'sem jogo'),out:true};
 drawPairs(ko);const p=ko.pairs.find(x=>x.includes(S.club));const nm=(s.k==='est'?ko.n||'Estadual':COMP[s.k])+' · '+KO_N[3-Math.log2(ko.alive.length)|0];
 if(!p)return{...base,bye:true,label:nm+(ko.alive.includes(S.club)?'':' (eliminado)'),out:true};
 return{...base,my:S.club,opp:p[0]===S.club?p[1]:p[0],home:p[0]===S.club,label:nm,final:ko.alive.length===2,ko:true}}
function simScore(a,b,home){const ga=gl(a,home?.025:0),gb=gl(b,home?0:.025);return[ga,gb]}
function scorer(comp,team,n,skip=0){const sq=sqd(team),w=[.02,.06,.14,.3,.48];for(let i=0;i<n-skip;i++){let r=RN(),j=0;while(j<4&&r>w[j]){r-=w[j];j++}const q=sq[j],k=q.n+'|'+team,o=S.comp.sc[comp]||(S.comp.sc[comp]={});(o[k]||(o[k]={n:q.n,c:team,g:0})).g++}}
function addMyGoals(comp,g){if(!g)return;const k='me',o=S.comp.sc[comp]||(S.comp.sc[comp]={});(o[k]||(o[k]={n:S.name,c:S.club,g:0,me:1})).g+=g;o[k].c=comp==='sel'?BRA:S.club}
function tabRes(a,b,x,y){const T=S.comp.bra.tab,A=T[a],B=T[b];A.j++;B.j++;A.gp+=x;A.gc+=y;B.gp+=y;B.gc+=x;if(x>y){A.v++;A.p+=3;B.d++}else if(x<y){B.v++;B.p+=3;A.d++}else{A.e++;B.e++;A.p++;B.p++}}
const table=()=>BR.slice().sort((a,b)=>{const T=S.comp.bra.tab,A=T[a],B=T[b];return B.p-A.p||(B.gp-B.gc)-(A.gp-A.gc)||B.gp-A.gp});
function zebra(a,b,x,y,comp){if(Math.abs(CL[a].t-CL[b].t)>=2&&((x>y&&CL[a].t<CL[b].t)||(y>x&&CL[b].t<CL[a].t))&&RN()<.5)news(`Zebra no ${COMP[comp]}!`,`${clubName(x>y?a:b)} surpreende e vence o ${clubName(x>y?b:a)} por ${Math.max(x,y)} x ${Math.min(x,y)}.`,'liga','star')}
// processa a rodada da data atual. res = placar do time do jogador (ou null se folga)
function processSlot(fx,res){const s=S.sl[S.wk];if(!s)return;
 if(s.k==='bra'){for(const[a,b]of S.comp.bra.sch[s.r]){let x,y;if(fx&&!fx.bye&&(a===fx.my||b===fx.my)){[x,y]=a===fx.my?res.s:[res.s[1],res.s[0]]}else{[x,y]=simScore(a,b,true);scorer('bra',a,x);scorer('bra',b,y);zebra(a,b,x,y,'bra')}tabRes(a,b,x,y)}
  if(s.r===S.comp.bra.sch.length-1){const tb=table();S.comp.bra.champ=tb[0];news(`${clubName(tb[0])} é campeão do Brasileirão ${LVN()}!`,'',tb[0]===S.club?'voce':'liga','career')}}
 else if(s.k!=='sel'){const ko=koFor(s.k);if(ko&&ko.champ==null&&ko.r===s.r){drawPairs(ko);const win=[];
  for(const[a,b]of ko.pairs){let x,y,w;if(fx&&!fx.bye&&(a===fx.my||b===fx.my)){[x,y]=a===fx.my?res.s:[res.s[1],res.s[0]];w=x>y?a:x<y?b:((res.pw===0)===(a===fx.my)?a:b)}
   else{[x,y]=simScore(a,b,true);scorer(s.k,a,x);scorer(s.k,b,y);w=x>y?a:x<y?b:(RN()<.5+(CL[a].t-CL[b].t)*.1?a:b);zebra(a,b,x,y,s.k)}
   ko.log.push(`${KO_N[3-Math.log2(ko.alive.length)|0]}: ${clubName(a)} ${x} x ${y} ${clubName(b)}${x===y?' (pên.)':''}`);win.push(w)}
  ko.alive=win;ko.pairs=null;ko.r++;if(win.length===1){ko.champ=win[0];news(`${clubName(win[0])} conquista o ${s.k==='est'?ko.n:COMP[s.k]}!`,'',win[0]===S.club?'voce':'liga','career');
   if(win[0]===S.club)trophy(`Campeão ${s.k==='est'?ko.n:COMP[s.k]} ${LVN()} ${S.season}`,s.k==='lib'?40:s.k==='cdb'?25:12,s.k==='lib'?1500:s.k==='cdb'?800:300)}}}
 S.wk++;weekTick();if(S.wk>=S.sl.length)seasonEnd()}
function trophy(t,rp=0,mo=0){S.tro.unshift(t);S.rep+=rp;S.money+=mo;news('🏆 '+t,rp?`+${rp} reputação, +R$ ${mo}.`:'','voce','career');toast('🏆 '+t)}
/* semana: recuperação, lesões, janela, eventos */
function weekTick(){S.ap=2;S.energy=C(S.energy+15+(S.pers==='Profissional'?5:0)+(S.inv.fisio?5:0),0,100);
 if(S.inj){S.inj.w--;if(S.inj.w<=0){news('Recuperado!','Você está liberado pelo departamento médico.','voce','physical');S.inj=null;toast('Você está recuperado da lesão')}}
 if(S.rival&&S.rival.out>0)S.rival.out--;if(S.coach)S.coach.w++;
 const s=S.sl[S.wk];if(s&&s.w)openWindow(s.w);
 if(S.con.end===S.season&&!S.con.loan&&!S.renew&&S.wk>=S.sl.length/2)offerRenewal();
 genInterest();convCheck();rollEvent()}
/* fim de temporada */
function seasonEnd(){const se=S.season,L=LVN(),pos=table().indexOf(S.club)+1,h=seasonPlayed(),avg=avgOf(h);
 checkGoals();news(`Fim da temporada ${se}`,`Brasileirão: ${pos}º lugar com o ${clubName(S.club)}.`,'voce','cal');
 const tb=table();if(tb[0]===S.club)trophy(`Campeão Brasileirão ${L} ${se}`,15,600);
 const sc=Object.values(S.comp.sc.bra||{}).sort((a,b)=>b.g-a.g);if(sc[0]&&sc[0].me&&sc[0].g>=3)trophy(`Artilheiro do Brasileirão ${L} ${se} (${sc[0].g} gols)`,12,400);
 if(avg>=7.5&&h.length>=6)trophy(`Craque da temporada ${L} ${se} (média ${avg.toFixed(1)})`,12,400);
 if(S.age<=20&&avg>=7.1&&h.length>=6)trophy(`Revelação ${L} ${se}`,8,200);
 if(S.Sv>=12)trophy(`Paredão da temporada ${L} ${se}`,8,250);
 for(const g of S.goals||[])if(!g.done){moraleAdd(-5);news(`Meta não cumprida: ${g.t}`,'','voce','career')}
 S.sh.unshift({s:se,c:S.club,l:S.lvl,j:S.G,g:S.Gl,a:S.A,sv:S.Sv,avg:+avg.toFixed(2),pos});
 if(S.lvl===2&&(pos<=3||(S.comp.cdb&&S.comp.cdb.champ===S.club))){S.qlib=1;news('Classificado para a Libertadores!','Seu clube disputará a competição na próxima temporada.','voce','star')}
 // empréstimo termina
 if(S.con.loan){const f=S.con.loan.from;S.th.unshift({s:se,from:S.club,to:f,t:'Fim de empréstimo',v:0});news('Fim do empréstimo',`Você volta para o ${clubName(f)}.`,'mercado','mkt');S.sal=S.con.loan.sal;S.club=f;S.con.loan=null;S.coach=null}
 // envelhecimento e categoria
 S.season++;S.age++;const dec=ageDecline();if(dec.length)news('O tempo passa',dec.join(', '),'voce','physical');
 const la=S.age<=17?0:S.age<=20?1:2,lr=S.rep>=LV[2].need?2:S.rep>=LV[1].need?1:0,nl=Math.max(S.lvl,la,lr);if(nl>S.lvl){S.lvl=nl;news(`Promoção: ${LV[nl].n}!`,'Você sobe de categoria.','voce','career');toast('Promoção para o '+LV[nl].n+'!')}
 // contrato
 if(S.con.end<S.season){if(S.renew&&S.renew.ok){S.renew=null}else{news('Contrato encerrado','Você está livre no mercado. Escolha um novo clube.','mercado','mkt');freeAgent()}}S.renew=null;
 if(S.age>=40){S.retired=1}
 buildSeason();sv()}

/* ---------- mercado ---------- */
function interestOf(ci){const o=ovr(),h=played().slice(0,5),av=h.length?avgOf(h):6;
 return C(Math.round((o-CL[ci].min+8)*5+(av-6)*12+S.rep/12+(CL[ci].t<CL[S.club].t?12:0)+(S.listed?15:0)-(S.age>31?(S.age-31)*6:0)+((hash(ci+':'+S.season)%21)-10)),0,100)}
function genInterest(){S.interest={};BR.forEach(i=>{if(i!==S.club)S.interest[i]=interestOf(i)})}
const canMove=()=>{const s=S.sl[S.wk];return !!(s&&s.w)&&!S.con.loan&&S.trs!==S.season+':'+s.w};
function mkOffer(ci,type,it){const sal=Math.round(CL[ci].s*(1+S.lvl*.5)*(.9+it/300)*(S.inv.emp?1.15:1));
 return type==='loan'?{c:ci,type,sal:Math.round(sal*.8),yrs:0,b:0,it,tries:0}:{c:ci,type,sal,yrs:2+((RN()*2)|0),b:Math.round(calcMV()*.05*(S.inv.emp?1.4:1)+CL[ci].s*2),it,tries:0}}
function openWindow(w){if(S.ow&&S.ow[w])return;S.ow=S.ow||{};S.ow[w]=1;if(S.con.loan)return;genInterest();
 const list=Object.entries(S.interest).map(([c,v])=>[+c,v]).filter(([c,v])=>v>=55).sort((a,b)=>b[1]-a[1]).slice(0,3);
 const offs=list.map(([c,v])=>mkOffer(c,S.bench>=2&&CL[c].t<=CL[S.club].t&&RN()<.6?'loan':'transfer',v));S.offers=[...S.offers.filter(o=>o.type==='free'||o.type==='renew'),...offs];
 if(offs.length)news(`Janela aberta: ${offs.length} proposta(s)`,offs.map(o=>clubName(o.c)+(o.type==='loan'?' (empréstimo)':'')).join(', '),'mercado','mkt');else news('Janela de transferências aberta','Nenhum clube fez proposta por enquanto.','mercado','mkt')}
function offerRenewal(){const sal=Math.round(Math.max(S.sal,CL[S.club].s*(1+S.lvl*.5))*(1+(S.ct-50)/200)*(S.inv.emp?1.1:1));S.renew={ok:0};S.offers.unshift({c:S.club,type:'renew',sal,yrs:2,b:0,it:Math.max(50,S.ct),tries:0});news('Proposta de renovação',`O ${clubName(S.club)} quer renovar seu contrato.`,'mercado','mkt')}
function freeAgent(){genInterest();const l=Object.entries(S.interest).map(([c,v])=>[+c,v]).sort((a,b)=>b[1]-a[1]).slice(0,3);S.offers=l.map(([c,v])=>({...mkOffer(c,'transfer',Math.max(v,50)),type:'free',b:Math.round(calcMV()*.12)}));S.freeAg=1}
function askTransfer(){if(S.listed)return;S.listed=1;S.ct=C(S.ct-8,0,100);genInterest();news('Você pediu para ser negociado','O treinador não gostou (-8 confiança). Clubes ficam mais atentos.','mercado','mkt');if(canMove()){S.ow={};openWindow(S.sl[S.wk].w)}sv();rd()}
function proposeTo(ci){if(!canMove()||ovr()<CL[ci].min||S.ask>=2)return;S.ask++;const it=Math.max(interestOf(ci),55);S.offers.push(mkOffer(ci,'transfer',it));negotiate(S.offers.length-1)}
function acceptOffer(k){const o=S.offers[k];if(!o)return;const from=S.club,yr=o.yrs;
 if(o.type==='renew'){S.sal=o.sal;S.con.end=S.season+o.yrs;S.renew={ok:1};S.ct=C(S.ct+5,0,100);S.offers.splice(k,1);news('Contrato renovado',`Até ${S.con.end}, R$ ${o.sal} por jogo.`,'mercado','mkt');toast('Contrato renovado!');sv();rd();return}
 if(o.type==='loan'){S.con.loan={from,sal:S.sal,end:S.season};S.th.unshift({s:S.season,from,to:o.c,t:'Empréstimo',v:0})}
 else{const fee=o.type==='free'?0:calcMV();S.th.unshift({s:S.season,from,to:o.c,t:o.type==='free'?'Sem custo':'Transferência',v:fee});S.con={end:S.season+yr,loan:null};S.money+=o.b}
 S.club=o.c;S.sal=o.sal;S.offers=[];S.listed=0;S.freeAg=0;S.bench=0;const s=S.sl[S.wk];S.trs=S.season+':'+(s&&s.w||'x');newCoach();newRival();S.ct=C(45+Math.round(S.rep/25),40,65);moraleAdd(8);S.rep+=CL[o.c].t*4;
 news(o.type==='loan'?`Emprestado ao ${clubName(o.c)}`:`Reforço do ${clubName(o.c)}!`,o.type==='loan'?'Até o fim da temporada.':`Contrato até ${S.con.end}. Luvas: R$ ${o.b}.`,'mercado','mkt');sv();presentation(o.c)}
function negotiate(k){const o=S.offers[k];if(!o)return;const box=$('evm'),card=box.querySelector('.card');let ask=0,yrs=o.yrs||0;
 const draw=(msg='')=>{const sal=Math.round(o.sal*(1+ask));card.innerHTML=`<h2>${icon('mkt')} ${o.type==='renew'?'Renovação':o.type==='loan'?'Empréstimo':'Proposta'}: ${clubName(o.c)}</h2>
  <div class="nego"><img src="${kitBadge(o.c)}" alt=""><div><b>${clubName(o.c)}</b><br><small>${['Emergente','Médio','Grande'][CL[o.c].t]} · interesse ${o.it}%</small>${bar(o.it,'var(--yl)')}</div></div>
  <p>Salário: <b class="yl">R$ ${sal} por jogo</b> ${ask?`<small>(pedido +${Math.round(ask*100)}%)</small>`:''}</p>
  ${o.type==='loan'?'<p>Duração: até o fim da temporada.</p>':`<p>Duração: <select id="ngy">${[1,2,3,4].map(y=>`<option ${y===yrs?'selected':''}>${y}</option>`).join('')}</select> temporada(s)</p>`}
  ${o.b?`<p>Luvas: R$ ${o.b}</p>`:''}<p class="mt">${msg||'Pedir mais pode irritar o clube. Duas recusas e a proposta é retirada.'}</p>
  <div class="tr"><button class="go" id="ng0">Aceitar</button><button id="ng1" ${o.tries>=2?'disabled':''}>Pedir +15%</button><button id="ng2" ${o.tries>=2?'disabled':''}>Pedir +30%</button><button id="ng3">Recusar</button></div>`;

function playNext(){if(M||S.freeAg)return;const fx=nextFx();if(!fx)return;if(fx.bye){advanceWeek();return}const st=status(fx);
 if(st==='Lesionado'||st==='Suspenso'){const r=simMyMatch(fx,st);rd();simResult(r,fx,st);return}
 if(st==='Reserva'&&RN()>=.7){const r=simMyMatch(fx,'Reserva');rd();simResult(r,fx,'Reserva');return}prematch(fx,st==='Reserva'?'sub':'full')}
function prematch(fx,mode){const box=$('evm'),c=box.querySelector('.card'),rec=S.coach&&fx.comp!=='sel'?['ofe','equ','def'].indexOf(S.coach.st):1;
 c.innerHTML=`<h2>${icon('career')} Preleção · ${clubName(fx.my)} x ${clubName(fx.opp)}</h2><p>${mode==='sub'?'<b class="yl">Você começa no banco e deve entrar no 2º tempo.</b> ':''}${S.coach&&fx.comp!=='sel'?`${S.coach.n} (${COACH_ST[S.coach.st][0]}) pede: <b class="yl">jogue ${POSI[rec][0].toLowerCase()}</b>.`:'Escolha seu posicionamento.'}</p>
 <div class="posi">${POSI.map((p,i)=>`<button data-ps="${i}" class="${i===rec?'rec':''}"><b>${p[0]}</b><br><small>${i===0?'Mais lances de ataque':i===1?'Lances equilibrados':'Mais lances de defesa'}</small>${i===rec?'<br><small class="yl">instrução do técnico</small>':''}</button>`).join('')}</div>
 <p class="mt">Ignorar a instrução custa confiança do treinador. ${S.energy<35?`<span class="rd">Energia ${S.energy}: você vai jogar cansado (menos fôlego, mais risco de lesão).</span>`:''}</p><button id="pmc" style="width:100%">Cancelar</button>`;box.classList.remove('hidden');
 c.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{box.classList.add('hidden');startMatch(fx,mode,+b.dataset.ps)});$('pmc').onclick=()=>box.classList.add('hidden')}

 $('ss1').onclick=()=>{$('snd').click();openSettings()};c.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sv;if(slotMeta(i)&&!confirm('Sobrescrever o espaço '+i+'?'))return;saveSlot(i);openSettings()});
 c.querySelectorAll('[data-ld]').forEach(b=>b.onclick=()=>{if(S.made&&!confirm('Carregar e substituir a carreira atual? (Ela continua salva no backup automático.)'))return;loadSlot(+b.dataset.ld);box.classList.add('hidden');closeMenu()});
 $('sx').onclick=exportSave;$('si').onclick=()=>$('impf').click();$('sdel').onclick=()=>{if(confirm('Apagar a carreira atual? Exporte antes se quiser guardar.')){try{localStorage.removeItem('bfc2')}catch(e){}S=def();box.classList.add('hidden');openMenu()}};$('sclose').onclick=()=>{box.classList.add('hidden');if(!$('menu').classList.contains('hidden'))openMenu()}}

let mraf=0;const MS={};

 if(!MS.p)MS.p={x:0,y:150,f:1,v:120,rp:0,pt:0,ph:2,z:0,rot:0,look:userLook(),num:S.num,cur:'dribble'};

 for(let i=0;i<40;i++){x.fillStyle=Math.sin(s*2+i)>0?'#fff':'#567';x.fillRect((i*53)%320,(i*29)%50,1,1)}
 x.fillStyle='#1a2133';x.fillRect(0,56,320,52);for(let r=0;r<6;r++)for(let i=0;i<64;i++){const c=['#ffd400','#0a7d3b','#eee','#1f4fd8','#3ddc84'][(i*7+r*3)%5],dy=Math.sin(s*8+i*.9+r)>.7?-1:0;x.fillStyle=c;x.fillRect(i*5+1,60+r*8+dy,3,3);x.fillStyle=SKIN[(i+r)%6][0];x.fillRect(i*5+2,58+r*8+dy,2,2)}
 if(Math.sin(s*3.7)>.96){x.fillStyle='#fff';x.fillRect((s*997)%320,60+((s*331)%40),2,2)}
 for(const lx of[16,300]){x.fillStyle='#3a4150';x.fillRect(lx,20,3,50);x.fillStyle='#fff8d0';x.fillRect(lx-7,14,17,7);x.fillStyle='rgba(255,250,200,.07)';x.beginPath();x.moveTo(lx-6,20);x.lineTo(lx+12,20);x.lineTo(160,180);x.lineTo(lx<100?0:320,180);x.fill()}
 x.fillStyle='#8a8a8a';x.fillRect(206,24,1,40);for(let i=0;i<12;i++){x.fillStyle=i%4===1||i%4===2?'#ffdf00':'#0a7d3b';x.fillRect(207+i*2,24+Math.sin(s*5+i*.5)*1.5,2,12)}
 for(let i=0;i<10;i++){x.fillStyle=i%2?'#2c7a46':'#338a51';x.fillRect(((i*40-s*60)%400+400)%400-40,108,40,72)}x.fillStyle='#f1f8ec';x.fillRect(0,110,320,1);
 const p=MS.p;p.x=(s*55)%380-30;p.y=160;p.rp=s*14;p.pt=s;p.cur='dribble';x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(p.x+3,p.y+1,9,3,0,0,7);x.fill();spr(x,p,kitOf(S.made?S.club:BRA),s);drawBall(x,{x:p.x+8,y:p.y+2,z:Math.abs(Math.sin(s*7))*6,rot:s*9},s);
 mraf=requestAnimationFrame(menuAnim)}
function openMenu(){if(M)return;MS.p=null;const m=$('mmenu'),has=S.made&&!S.retired;
 const B=(id,ic,t,d,cl='')=>`<button class="mbtn ${cl}" id="${id}">${icon(ic)}<span><b>${t}</b><small>${d}</small></span></button>`;
 m.innerHTML=`<div class="mlogo"><canvas id="crest2" width="17" height="19"></canvas><div><h1>BRASIL<span>FOOTBALL CAREER 3.0</span></h1><em>SEU SONHO. NOSSO FUTEBOL.</em></div><div class="pills" style="margin-left:auto">${has?`<span class="pill">${icon('star')}${S.rep}</span><span class="pill">${icon('coin')}R$ ${S.money}</span><span class="pill">${icon('cal')}${S.season}</span>`:''}</div></div>
 <div>${has?B('mcont','play','CONTINUAR CARREIRA','Siga sua jornada no futebol','go'):''}${B('mnew','career','NOVA CARREIRA','Comece do zero',has?'':'go')}
  ${has?B('mtr','train','TREINAMENTO','Evolua suas habilidades')+B('mplay','play','PRÓXIMO JOGO','Viva a próxima partida')+B('mmk','mkt','MERCADO','Negocie e transfira-se')+B('mst','shoot','ESTATÍSTICAS','Confira seus números')+B('mnw','news','NOTÍCIAS','Fique por dentro do futebol'):''}
  ${B('mset','news','CONFIGURAÇÕES','Som, salvar, carregar, exportar')}${B('mhow','star','COMO JOGAR','Regras e dicas')}<p id="mhelp" class="hidden card mt">Cada semana do calendário é um jogo. Entre os jogos você tem 2 ações (treinar ou descansar). Nas partidas, escolha a jogada (1, 2, 3) e pare o marcador na faixa verde (Espaço ou toque); no centro dourado o acerto é perfeito. Seja titular agradando o treinador, cumpra metas, negocie contratos nas janelas e dispute Estadual, Brasileirão, Copa do Brasil, Libertadores e Seleção.</p>${loadNote?`<p class="rd">${loadNote}</p>`:''}</div>
 <div class="slogan">Aqui começa<br><b>sua lenda!</b></div>
 <div>${has?playerCard('mav')+`<div class="card news"><h2>${icon('news')} Últimas notícias</h2>${S.news.slice(0,3).map(n=>`<p>${icon(n.ic||'news')}<span><b>${esc(n.t)}</b><small>${esc(n.d)}</small></span></p>`).join('')}</div>`:'<div class="card"><h2>Bem-vindo!</h2><p>Crie seu atleta, comece na base Sub-17 e construa uma carreira até a Seleção.</p></div>'}</div>
 <div style="grid-column:1/-1">${has?compStrip():''}<p class="quote">"Grandes jogadores não nascem prontos, eles se constroem."</p></div>`;
 drawCrest($('crest2'));avatarTo($('mav'));$('menu').classList.remove('hidden');cancelAnimationFrame(mraf);mraf=requestAnimationFrame(menuAnim);
 const go=(id,fn)=>{if($(id))$(id).onclick=()=>{SND.ui(660);fn()}};go('mcont',()=>{closeMenu();setTimeout(showEvent,300)});go('mnew',()=>{if(has&&!confirm('Começar uma nova carreira? A atual será substituída (exporte ou salve num espaço antes, se quiser).'))return;closeMenu();openCreate()});
 go('mtr',()=>{closeMenu();page('train')});go('mplay',()=>{closeMenu();page('home')});go('mmk',()=>{closeMenu();page('mkt','ofertas')});go('mst',()=>{closeMenu();page('career','stats')});go('mnw',()=>{closeMenu();page('career','news')});go('mset',openSettings);go('mhow',()=>$('mhelp').classList.toggle('hidden'));
 m.querySelectorAll('[data-cmp]').forEach(b=>b.onclick=()=>{closeMenu();const k=b.dataset.cmp;page('play',k==='bra'?'tab':k==='sel'?'cal':'copas')})}
const closeMenu=()=>{$('menu').classList.add('hidden');cancelAnimationFrame(mraf)};
$('hm').onclick=()=>{if(!M)openMenu()};

const CR={step:0,name:'Gabriel Silva',num:10,foot:'Direito',pos:'Meia-atacante',style:'Armador',pers:'Profissional',sk:2,hs:0,hc:0,club:0};
function openCreate(){Object.assign(CR,{step:0});const l=lookOf('u'+CR.name);CR.sk=l.sk;CR.hs=l.hs;CR.hc=l.hc;$('mod').classList.remove('hidden');wiz()}
function wiz(){const w=$('wiz'),st=CR.step,P=['Meia-atacante','Atacante','Ponta-direita','Ponta-esquerda','Volante','Zagueiro','Lateral','Goleiro'];if(!STY_POS(CR.pos).includes(CR.style))CR.style=STY_POS(CR.pos)[0];
 let h=`<h2>${icon('career')} Criar atleta · passo ${st+1} de 4</h2><div class="wiz">${[0,1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div><div class="cre"><div>`;
 if(st===0)h+=`<label for="nn">Nome</label><input id="nn" maxlength="22" value="${esc(CR.name)}"><label for="nu">Camisa</label><input id="nu" type="number" min="1" max="99" value="${CR.num}"><label for="nf">Pé dominante</label><select id="nf">${['Direito','Esquerdo','Ambos'].map(f=>`<option ${f===CR.foot?'selected':''}>${f}</option>`).join('')}</select>`;
 if(st===1)h+=`<label>Posição</label><div class="cards3">${P.map(p=>`<button data-cp="${p}" class="${p===CR.pos?'on':''}"><b>${PAB[p]}</b>${p}</button>`).join('')}</div><label>Estilo de jogo</label><div class="cards3">${STY_POS(CR.pos).map(s=>`<button data-cs="${s}" class="${s===CR.style?'on':''}"><b>${s}</b><small>${STY[s].d}</small></button>`).join('')}</div>
  <label>Personalidade</label><div class="cards3">${Object.keys(PERS).map(p=>`<button data-cq="${p}" class="${p===CR.pers?'on':''}"><b>${p}</b><small>${PERS[p]}</small></button>`).join('')}</div>`;
 if(st===2)h+=`<label>Tom de pele</label><div class="sw">${SKIN.map((s,i)=>`<button data-sk="${i}" class="${i===CR.sk?'on':''}" style="background:${s[0]}" aria-label="Tom ${i+1}"></button>`).join('')}</div><label for="nh">Cabelo</label><select id="nh">${HAIRS.map((x,i)=>`<option value="${i}" ${i===CR.hs?'selected':''}>${x}</option>`).join('')}</select><label>Cor do cabelo</label><div class="sw">${HAIRC.map((x,i)=>`<button data-hc="${i}" class="${i===CR.hc?'on':''}" style="background:${x}" aria-label="Cor ${i+1}"></button>`).join('')}</div>`;
 if(st===3)h+=`<label>Clube da base</label><div class="clubs">${[0,1,2].map(i=>`<button data-cc="${i}" class="${i===CR.club?'on':''}"><img src="${kitBadge(i)}" alt="">${CL[i].n}</button>`).join('')}</div><p class="mt">Você começa no Sub-17, com 16 anos. Seu potencial será revelado aos poucos pelos olheiros.</p>`;
 h+=`</div><canvas id="cp" width="64" height="64"></canvas></div><p></p><div class="toolbar"><button id="wb" ${st?'':'disabled'}>Voltar</button><button class="go" id="wn" style="flex:1">${st<3?'Próximo':'Começar carreira'}</button><button id="wx">Cancelar</button></div>`;
 w.innerHTML=h;const pv=()=>{const x=$('cp').getContext('2d'),l=lookOf('u'+CR.name);l.sk=CR.sk;l.hs=CR.hs;l.hc=CR.hc;x.clearRect(0,0,64,64);portrait(x,0,0,4,l,kitOf(CR.club),CR.num,{ex:1,gk:CR.pos==='Goleiro'})};
 const rd0=()=>{if($('nn'))CR.name=$('nn').value.trim()||'Jogador';if($('nu'))CR.num=C(+$('nu').value||10,1,99);if($('nf'))CR.foot=$('nf').value;if($('nh'))CR.hs=+$('nh').value};
 w.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',()=>{rd0();pv()}));
 const bind=(a,k,num)=>w.querySelectorAll(`[data-${a}]`).forEach(b=>b.onclick=()=>{CR[k]=num?+b.dataset[a]:b.dataset[a];wiz()});bind('cp','pos');bind('cs','style');bind('cq','pers');bind('sk','sk',1);bind('hc','hc',1);bind('cc','club',1);
 $('wb').onclick=()=>{rd0();CR.step--;wiz()};$('wx').onclick=()=>{$('mod').classList.add('hidden');openMenu()};$('wn').onclick=()=>{rd0();if(st<3){CR.step++;wiz()}else createCareer()};pv()}
function createCareer(){S=def();Object.assign(S,{name:CR.name,pos:CR.pos,foot:CR.foot,num:CR.num,style:CR.style,pers:CR.pers,club:CR.club,made:1,look:{sk:CR.sk,hs:CR.hs,hc:CR.hc}});
 const a=S.attrs,b=POS[S.pos];for(const k in b)a[k]=C(a[k]+b[k],20,99);for(const k of(STY[S.style]||{a:[]}).a)a[k]=C(a[k]+2,20,99);S.pot=C(68+((RN()*24)|0),68,94);S.sal=CL[S.club].s;S.con={end:S.season+2,loan:null};
 buildSeason();news('Bem-vindo à base!',`Você assinou com o ${clubName(S.club)} até ${S.con.end}. O treinador quer ver você em campo.`,'voce','star');

 box.classList.remove('hidden');$('rnew').onclick=()=>{box.classList.add('hidden');openCreate()};$('rexp').onclick=exportSave}
addEventListener('keydown',e=>{if(!M)return;if(M.ph==='intro'&&(e.key===' '||e.key==='Enter')){e.preventDefault();skipIntro();return}if(e.key.length>1&&e.key!==' ')return;if(e.key===' '&&(M.ph==='time'||M.ph==='sot')){e.preventDefault();tap()}else if((M.ph==='pick'||M.ph==='sop')&&'123'.includes(e.key))pick(+e.key-1)});
